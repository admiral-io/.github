# Self-hosted Renovate for the admiral-io organization.
#
# The Mend-hosted Renovate app cannot read private Go modules
# (github.com/admiral-io/*, notably admiral-platform-sdk-go): its `go mod tidy`
# runs without GOPRIVATE and without a token that can clone them, so every
# "update admiral sdk" PR lands with a stale go.sum and a failing Lint check.
# Running Renovate here gives it both. A dedicated GitHub App (contents,
# pull requests, issues and workflows write; checks and statuses read) is the
# platform identity; Renovate reuses its token for git over https on
# github.com, and customEnvVariables sets GOPRIVATE for the Go tooling it
# shells out to. It is deliberately not admiral-ci, which stays read-only.
#
# Repos are discovered through the App installation, so installing the App on
# a repo is what opts it in. Per-repo behaviour still comes from default.json
# in this repo via each repo's `renovate.json` (extends local>admiral-io/.github).
name: Renovate

on:
  schedule:
    # Hourly, off the top of the hour to dodge GitHub's cron congestion. The
    # preset's own schedules (earlyMondays, "at any time" for admiral SDKs)
    # decide what gets a PR within a run; this only decides how often we look.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]
      dry-run:
        description: Plan only, open nothing
        type: boolean
        default: false

# One run at a time; an hourly run that overlaps its predecessor would race
# on the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Renovate
        # renovate-version is left to the action's default major tag, which
        # the action bumps as it releases; Renovate bumps this pin.
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "true"
          RENOVATE_AUTODISCOVER_FILTER: "admiral-io/*"
          # Reaches the Go toolchain inside Renovate's `go get` / `go mod tidy`.
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GOPRIVATE":"github.com/admiral-io/*"}'
          # Onboarding PRs for repos without a renovate.json propose the org
          # preset rather than config:recommended.
          RENOVATE_ONBOARDING_CONFIG: '{"$schema":"https://docs.renovatebot.com/renovate-schema.json","extends":["local>admiral-io/.github"]}'
