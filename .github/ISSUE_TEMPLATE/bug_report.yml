name: Bug report
description: Something in this repository's code does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Remove API keys, tokens and
        anything else secret from what you paste. If the problem is not in this
        repository's code, open it in
        [admiral-community](https://github.com/admiral-io/admiral-community/issues/new/choose)
        instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest set of steps, commands or configuration that shows the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you are using, and your OS if it matters.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Pasted as text. It is formatted as code automatically.
      render: shell
