name: Feature request
description: Suggest something this repository should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and what gets in your way. The problem matters more to us than a proposed solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
