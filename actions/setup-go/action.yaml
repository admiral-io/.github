name: "Setup Go"
description: "Setup Go with caching for faster builds"

inputs:
  go-version:
    description: "Go version override (uses go.mod by default)"
    required: false
  github-token:
    description: "GitHub token for private module access (requires cross-repo read)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure private Go modules
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
    - name: Setup Go
      uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
        cache: true
        cache-dependency-path: |
          **/go.sum
    - name: Set GOPRIVATE
      shell: bash
      run: go env -w GOPRIVATE='github.com/admiral-io/*'
